name: Android

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y zlib1g-dev
      - name: Java tests (zip installer, log tail)
        run: |
          mkdir -p /tmp/jt
          J=android/app/src/main/java/org/ember/engine
          javac -Xlint:all -d /tmp/jt $J/ZipInstaller.java $J/LogTail.java $J/SettingsStore.java tests/java/EmberJavaTests.java
          java -cp /tmp/jt org.ember.engine.EmberJavaTests
      - run: cmake -S . -B build -DEMBER_BUILD_TESTS=ON
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure

  apk:
    needs: host-tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build debug APK
        working-directory: android
        run: |
          gradle wrapper --gradle-version 8.9
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ember-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
